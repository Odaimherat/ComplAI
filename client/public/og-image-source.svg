<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="85%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#7b5cfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7b5cfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="5%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#2ed3a3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2ed3a3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9580ff"/>
      <stop offset="100%" stop-color="#4fd8c4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0e13"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Shield mark -->
  <g transform="translate(80,80)">
    <path d="M40 0 L84 14 V52 C84 78 66 96 40 106 C14 96 -4 78 -4 52 V14 Z" fill="#141a22" stroke="#7b5cfa" stroke-width="2.5"/>
    <path d="M16 52 L34 70 L66 30" fill="none" stroke="#9580ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="200" y="150" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#e9eef4">ComplAI</text>

  <!-- Headline -->
  <text x="80" y="290" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#e9eef4">Continuous compliance,</text>
  <text x="80" y="356" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="url(#ring)">powered by AI.</text>

  <text x="80" y="420" font-family="Arial, sans-serif" font-size="24" fill="#93a1b0">GRC automation, AI-powered SOC, defensive &amp; offensive security</text>
  <text x="80" y="454" font-family="Arial, sans-serif" font-size="24" fill="#93a1b0">SOC 2 &#183; ISO 27001 &#183; HIPAA &#183; GDPR &#183; PCI DSS &#183; NIST CSF &#183; CMMC</text>

  <!-- Gauge motif, echoing the homepage's signature visualization -->
  <g transform="translate(970,470)">
    <circle cx="0" cy="0" r="78" fill="none" stroke="#232c37" stroke-width="12"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="url(#ring)" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="490" stroke-dashoffset="60" transform="rotate(-90)"/>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#e9eef4">98%</text>
    <text x="0" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#93a1b0" letter-spacing="1">AUDIT READY</text>
  </g>
</svg>
